name: store-validate
on:
  push:
    paths: ["apps/**"]
  pull_request:
    paths: ["apps/**"]
  schedule:
    - cron: "0 * * * *"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node validate.mjs
