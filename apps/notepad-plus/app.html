<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:sans-serif;margin:0;display:flex;flex-direction:column;height:100vh}textarea{flex:1;padding:14px;font-size:15px;border:0;outline:0}#bar{padding:8px;background:#f1f5f9}button{padding:8px 12px;border-radius:8px;border:0;background:#3b82f6;color:#fff}</style>
<div id="bar"><button onclick="save()">Kaydet</button> <span id="m"></span></div><textarea id="e"></textarea>
<script>const e=document.getElementById('e');e.value=localStorage.getItem('np')||'';e.oninput=()=>{localStorage.setItem('np',e.value);document.getElementById('m').textContent='kaydedildi '+new Date().toLocaleTimeString()};function save(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([e.value],{type:'text/plain'}));a.download='not.txt';a.click()}</script>
