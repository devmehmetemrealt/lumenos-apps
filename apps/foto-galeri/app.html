<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{font-family:sans-serif;margin:0;padding:16px;background:#020617;color:#fff}img{width:100%;border-radius:10px}#g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}</style>
<h2>Foto Galeri</h2><div id="g"></div>
<script>let h='';for(let i=1;i<=12;i++)h+='<a target="_blank" href="https://picsum.photos/id/'+(i*10)+'/800/600"><img loading="lazy" src="https://picsum.photos/id/'+(i*10)+'/400/300"></a>';document.getElementById('g').innerHTML=h;</script>
